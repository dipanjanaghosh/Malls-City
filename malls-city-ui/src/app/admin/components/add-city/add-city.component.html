<div class="main-container">
  <!-- Left Side: City List Section -->
  <div class="city-list-section">
    <app-city-list
      *ngIf="cityList"
      [cityListInput]="cityList"
      (editCity)="onEditCity($event)"
    ></app-city-list>
  </div>

  <!-- Right Side: Add City Form Section -->
  <div class="city-form-section">
    <div class="form-header">
      <h3>{{ isEditMode ? "Update City" : "Add New City" }}</h3>
      <button *ngIf="isEditMode" mat-button color="warn" (click)="resetForm()">
        Cancel Edit
      </button>
    </div>
    <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="state">Select State</label>
        <select formControlName="selectedState" id="state">
          <option value="" disabled selected>Select State</option>
          <option *ngFor="let state of states" [value]="state">
            {{ state }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label for="cityName">City Name</label>
        <input
          type="text"
          formControlName="cityName"
          id="cityName"
          placeholder="Enter City Name"
        />
      </div>

      <div class="form-group">
        <label for="cityCode">City Code</label>
        <input
          type="text"
          formControlName="cityCode"
          id="cityCode"
          placeholder="Enter City Code"
        />
      </div>

      <button mat-raised-button type="submit" [disabled]="myForm.invalid">
        {{ isEditMode ? "Update City" : "Add City" }}
      </button>
    </form>
  </div>
</div>
