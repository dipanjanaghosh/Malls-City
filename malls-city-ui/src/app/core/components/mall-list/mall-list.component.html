<div class="mall-list-container">
  <div class="hero-section">
    <div class="hero-content">
      <h1>
        Explore Malls in <span>{{ selectedCity }}</span>
      </h1>
      <p>
        Discover the best shopping destinations, entertainment, and dining
        experiences in your city.
      </p>
    </div>
  </div>

  <div class="content-wrapper">
    <div class="mall-grid">
      <app-card
        *ngFor="let item of mallList"
        [title]="item.name"
        [imageUrl]="item.img"
        [content]="item.description"
      >
        <div actions class="card-actions">
          <button mat-stroked-button color="primary" class="btn-details">
            View Details
          </button>
          <button mat-icon-button color="warn" class="btn-like">
            <mat-icon>favorite</mat-icon>
          </button>
          <button mat-icon-button color="primary" class="btn-share">
            <mat-icon>share</mat-icon>
          </button>
        </div>
      </app-card>
    </div>
  </div>
</div>
